AppBundle\Entity\User:
    user_{1..5}:
        name: <name()>
        lastName: <lastName()>
        plainPassword: 'foo'
        roles: ['ROLE_ADMIN']

AppBundle\Entity\cliente:
    cliente_{1..10}:
        clientNumber: <numberBetween(10,50)>
        startAt: <dateTimeBetween('-3 mounths','now')>
        endAt: <dateTimeBetween('-3 years', 'now')>
        description: <paragraph()>
        fact: factura<current()>

AppBundle\Entity\Proveedor:
    proveedor_{1..10}:
        contratNumber: <numberBetween(10,50)>
        numberAccount: <numberBetween(1000,10000)>
        startAt: <dateTimeBetween('-3 mounths','now')>
        endAt: <dateTimeBetween('-3 years', 'now')>

AppBundle\Entity\Factura:
    factura_{1..10}:
        importeCuc: <numberBetween(1000,50000)>
        importeCup: <numberBetween(1000,10000)>
        contratos: [Contrato<current()>]